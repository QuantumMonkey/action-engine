[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-readonly-mcp"
version = "0.1.0"
description = "MCP server that serves one local SQLite database, read-only by construction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sqlite-readonly-mcp = "sqlite_mcp_server.server:main"

[project.urls]
Repository = "https://github.com/QuantumMonkey/action-engine"

[tool.setuptools]
packages = ["sqlite_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
